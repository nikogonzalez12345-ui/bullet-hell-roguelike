<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Void Runner — Bullet Hell Roguelike</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <canvas id="overlay" width="960" height="600"></canvas>

    <div id="hud">
      <div id="hpBarWrap"><div id="hpBar"></div></div>
      <div id="hudRow">
        <span id="waveLabel">Wave 1</span>
        <span id="scoreLabel">Score 0</span>
      </div>
      <div id="dashBarWrap"><div id="dashBar"></div></div>
      <div id="weaponRow"></div>
    </div>

    <div id="startScreen" class="overlay">
      <h1>VOID RUNNER</h1>
      <p class="sub">a bullet hell roguelike</p>
      <div class="controls">
        <p><b>Move</b> WASD</p>
        <p><b>Look / Aim</b> Mouse</p>
        <p><b>Shoot</b> Hold Left Click</p>
        <p><b>Dodge Roll</b> Space / Right Click</p>
        <p><b>Pause</b> Esc</p>
      </div>
      <button id="startBtn">Start Run</button>
    </div>

    <div id="pauseScreen" class="overlay hidden">
      <h2>Paused</h2>
      <p class="sub">Click to resume</p>
    </div>

    <div id="upgradeScreen" class="overlay hidden">
      <h2>Wave Cleared</h2>
      <p class="sub">Choose an upgrade</p>
      <div id="upgradeCards"></div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1>YOU DIED</h1>
      <p class="sub" id="finalStats"></p>
      <button id="restartBtn">Try Again</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/constants.js"></script>
  <script src="src/utils.js"></script>
  <script src="src/ps1.js"></script>
  <script src="src/world.js"></script>
  <script src="src/models.js"></script>
  <script src="src/weapons.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/patterns.js"></script>
  <script src="src/spawner.js"></script>
  <script src="src/upgrades.js"></script>
  <script src="src/render3d.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
