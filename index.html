<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Void Runner — Bullet Hell Roguelike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css?v=749b3a1">
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <canvas id="overlay" width="960" height="600"></canvas>

    <div id="mainMenu" class="screen">
      <h1 class="title">VOID<br>RUNNER</h1>
      <p class="tag">A BULLET HELL ROGUELIKE</p>
      <div class="menu">
        <button data-action="new">NEW GAME</button>
        <button data-action="controls" class="alt">CONTROLS</button>
      </div>
      <div id="controlsPanel" class="panel keys hidden">
        <div class="row"><span>MOVE</span><span>WASD</span></div>
        <div class="row"><span>TURN / AIM</span><span>MOUSE</span></div>
        <div class="row"><span>SHOOT</span><span>HOLD LMB</span></div>
        <div class="row"><span>DODGE ROLL</span><span>SPACE / RMB</span></div>
        <div class="row"><span>GEAR + BACKPACK</span><span>TAB / I</span></div>
        <div class="row"><span>DRINK POTION</span><span>Q</span></div>
        <div class="row"><span>PAUSE</span><span>ESC</span></div>
      </div>
      <p class="footnote">EVERY ISLAND IS PROCEDURALLY GENERATED</p>
    </div>

    <div id="pauseMenu" class="screen dim hidden">
      <h2>PAUSED</h2>
      <div class="menu">
        <button data-action="resume">RESUME</button>
        <button data-action="menu" class="alt">MAIN MENU</button>
      </div>
      <p class="footnote" id="seedLabel"></p>
    </div>

    <div id="levelUpScreen" class="screen dim hidden">
      <h2 class="gold">LEVEL UP!</h2>
      <p class="tag" id="levelUpSub"></p>
      <div id="upgradeCards"></div>
    </div>

    <div id="inventoryScreen" class="screen dim hidden">
      <div class="panel inv">
        <div class="inv-head">
          <h2>GEAR</h2>
          <button data-action="closeInv" class="small alt">CLOSE [TAB]</button>
        </div>
        <div class="inv-body">
          <div class="inv-left">
            <div id="equipSlots"></div>
            <div id="statsPanel" class="keys"></div>
          </div>
          <div class="inv-right">
            <h3 id="bagTitle">BACKPACK</h3>
            <div id="bagGrid"></div>
            <p class="footnote">LEVEL UP TO UNLOCK MORE SLOTS</p>
          </div>
        </div>
      </div>
      <div id="tooltip" class="tooltip hidden"></div>
    </div>

    <div id="gameOverScreen" class="screen dim hidden">
      <h1 class="title red">YOU DIED</h1>
      <div id="finalStats" class="panel keys"></div>
      <div class="menu">
        <button data-action="new">NEW GAME</button>
        <button data-action="menu" class="alt">MAIN MENU</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="src/constants.js?v=749b3a1"></script>
  <script src="src/utils.js?v=749b3a1"></script>
  <script src="src/ps1.js?v=749b3a1"></script>
  <script src="src/world.js?v=749b3a1"></script>
  <script src="src/models.js?v=749b3a1"></script>
  <script src="src/items.js?v=749b3a1"></script>
  <script src="src/weapons.js?v=749b3a1"></script>
  <script src="src/entities.js?v=749b3a1"></script>
  <script src="src/patterns.js?v=749b3a1"></script>
  <script src="src/director.js?v=749b3a1"></script>
  <script src="src/upgrades.js?v=749b3a1"></script>
  <script src="src/render3d.js?v=749b3a1"></script>
  <script src="src/hud.js?v=749b3a1"></script>
  <script src="src/ui.js?v=749b3a1"></script>
  <script src="src/game.js?v=749b3a1"></script>
  <script src="src/main.js?v=749b3a1"></script>
</body>
</html>
